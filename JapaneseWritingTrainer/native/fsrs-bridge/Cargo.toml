[package]
name = "japanese-writing-fsrs-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "japanese_writing_fsrs"
crate-type = ["cdylib"]

[dependencies]
fsrs = "=6.6.2"
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
