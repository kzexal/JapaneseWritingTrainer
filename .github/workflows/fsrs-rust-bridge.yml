name: FSRS Rust bridge

on:
  push:
    branches: [feature/guided-writing]
    paths:
      - "JapaneseWritingTrainer/native/fsrs-bridge/**"
  pull_request:
    paths:
      - "JapaneseWritingTrainer/native/fsrs-bridge/**"
  workflow_dispatch:

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JapaneseWritingTrainer/native/fsrs-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test
