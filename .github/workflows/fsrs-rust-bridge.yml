name: FSRS Rust bridge

on:
  push:
    branches: [feature/guided-writing, feature/fsrs-rust-jni]
    paths:
      - "JapaneseWritingTrainer/native/**"
      - ".github/workflows/fsrs-rust-bridge.yml"
  pull_request:
    paths:
      - "JapaneseWritingTrainer/native/**"
      - ".github/workflows/fsrs-rust-bridge.yml"
  workflow_dispatch:

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JapaneseWritingTrainer/native/fsrs-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

  android-native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install Rust Android targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk
      - name: Build Android shared libraries
        working-directory: JapaneseWritingTrainer/native/fsrs-bridge
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -o ../../app/src/main/jniLibs build --release
